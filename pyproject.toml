[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "printify-publish-queue"
version = "1.0.0"
description = "A hardened publish flow for the Printify API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Kyle Miller", email = "kyle@themisfoundry.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python",
]
dependencies = [
    "requests>=2.25.0",
]

[tool.setuptools]
py-modules = ["printify_publish_queue"]
