<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <radialGradient id="panelglow" cx="0.22" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#1b2a4a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0a1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2c4c"/>
      <stop offset="1" stop-color="#16203a"/>
    </linearGradient>
    <linearGradient id="cardDanger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2230"/>
      <stop offset="1" stop-color="#2a1824"/>
    </linearGradient>
    <linearGradient id="cardSafe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16322c"/>
      <stop offset="1" stop-color="#102621"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3e63"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs><rect x="1" y="1" width="998" height="498" rx="26" fill="url(#panel)"/><rect x="1" y="1" width="998" height="498" rx="26" fill="url(#panelglow)"/><rect x="1.5" y="1.5" width="997" height="497" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/><text x="42" y="54" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#eef3fb" letter-spacing="0.2">printify-publish-queue</text><text x="42" y="78" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#98a6bc">What happens after you publish, so you never get duplicates</text><g filter="url(#shadow)"><rect x="40" y="204" width="188" height="96" rx="18" fill="url(#card)"/></g><rect x="40" y="204" width="188" height="96" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.10"/><text x="64" y="238" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6f7d93" text-anchor="start" letter-spacing="1.6">PUBLISH</text><text x="64" y="264" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#eef3fb" text-anchor="start" letter-spacing="0">HTTP 200, queued</text><g filter="url(#glow)"><path d="M 410 196.0 L 462.0 222.0 L 462.0 270.0 Q 462.0 288.0 410 316.0 Q 358.0 288.0 358.0 270.0 L 358.0 222.0 Z" fill="url(#shield)" stroke="#5cc7ff" stroke-width="2.6" stroke-opacity="0.95"/></g><path d="M 393.0 252 L 405.0 264.0 L 429.0 238.0" fill="none" stroke="#5cc7ff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/><text x="410" y="340.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#eef3fb" text-anchor="middle">publish-queue</text><text x="410" y="358.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#98a6bc" text-anchor="middle">wait, then verify</text><path d="M 228 252 C 290.0 252, 290.0 252, 343 252" fill="none" stroke="#98a6bc" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/><path d="M 343 247 L 352 252 L 343 257 Z" fill="#98a6bc" fill-opacity="0.8"/><g filter="url(#shadow)"><rect x="648" y="60" width="330" height="112" rx="18" fill="url(#cardSafe)"/></g><rect x="648" y="60" width="330" height="112" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.10"/><rect x="648" y="74" width="4" height="84" rx="2" fill="#57e0a6"/><rect x="672" y="80" width="110" height="28" rx="14" fill="#57e0a6" fill-opacity="0.16" stroke="#57e0a6" stroke-opacity="0.55"/><text x="727" y="99" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#57e0a6" text-anchor="middle" letter-spacing="0.6">SUCCEEDED</text><text x="674" y="124" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#98a6bc" text-anchor="start" letter-spacing="0">external id appears, or the</text><text x="674" y="146" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#98a6bc" text-anchor="start" letter-spacing="0">listing is found on the channel</text><g filter="url(#shadow)"><rect x="648" y="192" width="330" height="112" rx="18" fill="url(#card)"/></g><rect x="648" y="192" width="330" height="112" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.10"/><rect x="648" y="206" width="4" height="84" rx="2" fill="#f3c668"/><rect x="672" y="212" width="135" height="28" rx="14" fill="#f3c668" fill-opacity="0.16" stroke="#f3c668" stroke-opacity="0.55"/><text x="739" y="231" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#f3c668" text-anchor="middle" letter-spacing="0.6">STILL QUEUED</text><text x="674" y="256" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#98a6bc" text-anchor="start" letter-spacing="0">locked after the wait.</text><text x="674" y="278" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#98a6bc" text-anchor="start" letter-spacing="0">Leave it alone, never re-publish.</text><g filter="url(#shadow)"><rect x="648" y="324" width="330" height="124" rx="18" fill="url(#cardDanger)"/></g><rect x="648" y="324" width="330" height="124" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.10"/><rect x="648" y="338" width="4" height="96" rx="2" fill="#ff6f76"/><rect x="672" y="344" width="152" height="28" rx="14" fill="#ff6f76" fill-opacity="0.16" stroke="#ff6f76" stroke-opacity="0.55"/><text x="748" y="363" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ff6f76" text-anchor="middle" letter-spacing="0.6">SILENT FAILURE</text><text x="674" y="388" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#98a6bc" text-anchor="start" letter-spacing="0">gone from the channel: delete,</text><text x="674" y="410" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#98a6bc" text-anchor="start" letter-spacing="0">recreate, retry once, then a human.</text><path d="M 462 224 C 555.0 224, 555.0 116, 639 116" fill="none" stroke="#57e0a6" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/><path d="M 639 111 L 648 116 L 639 121 Z" fill="#57e0a6" fill-opacity="0.8"/><path d="M 462 252 C 555.0 252, 555.0 248, 639 248" fill="none" stroke="#f3c668" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/><path d="M 639 243 L 648 248 L 639 253 Z" fill="#f3c668" fill-opacity="0.8"/><path d="M 462 280 C 555.0 280, 555.0 386, 639 386" fill="none" stroke="#ff6f76" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/><path d="M 639 381 L 648 386 L 639 391 Z" fill="#ff6f76" fill-opacity="0.8"/><text x="42" y="474" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#6f7d93" text-anchor="start" letter-spacing="0">Queued and silently-failed look identical for minutes. Only time plus a direct channel check tells them apart.</text></svg>